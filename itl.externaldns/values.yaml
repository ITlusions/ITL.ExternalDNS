external-dns:
  # RFC2136: syncs records into our self-hosted BIND server (pandora,
  # 192.168.1.241) via dynamic DNS update, rather than any cloud DNS API.
  provider:
    name: rfc2136

  # Reads Services, Ingresses, and Gateway API HTTPRoutes (the internal
  # Traefik instance uses Gateway API, not Ingress - see ITL.Traefik).
  sources:
    - service
    - ingress
    - gateway-httproute

  # Scoped to exactly the three zones externaldns-int is actually granted
  # on BIND (see ITL.Bind.Config's named.conf.local) - not "every zone on
  # the server". public.k8s.int.itlusions.com (old externaldns key) and
  # the static cnpg.*/int.itlusions.com zones (no grant for any key) stay
  # out of reach regardless of this filter, because the TSIG key itself
  # has no write access there.
  domainFilters:
    - int.itlusions.nl
    - k8s.int.itlusions.nl
    - infra.int.itlusions.nl

  # One owner ID per cluster, so records from other clusters (or the old
  # externaldns key's zone) are left alone.
  txtOwnerId: itl-talos

  # sync: create, update and delete records. Use upsert-only while testing
  # a config change you're not fully sure of yet.
  policy: sync
  registry: txt
  txtPrefix: external-dns-

  extraArgs:
    - --rfc2136-host=192.168.1.241
    - --rfc2136-port=5354
    # Three separate --rfc2136-zone entries, not one - k8s.int.itlusions.nl
    # and infra.int.itlusions.nl are each their OWN independently
    # authoritative zone on BIND (separate zone files), not reachable by
    # AXFR'ing int.itlusions.nl alone. k8s.int.itlusions.nl is NS-
    # delegated from int.itlusions.nl's apex, but the delegation only
    # hands you the glue record, not the child zone's actual data -
    # external-dns needs its own transfer of each zone to see inside it.
    - --rfc2136-zone=int.itlusions.nl
    - --rfc2136-zone=k8s.int.itlusions.nl
    - --rfc2136-zone=infra.int.itlusions.nl
    # externaldns-int, NOT the older "externaldns" key - that one only
    # has an update-policy grant on the old public.k8s.int.itlusions.com
    # zone. externaldns-int is the key actually granted on
    # int.itlusions.nl / k8s.int.itlusions.nl / infra.int.itlusions.nl -
    # see ITL.Bind.Config's named.conf.local.
    - --rfc2136-tsig-keyname=externaldns-int
    - --rfc2136-tsig-secret-alg=hmac-sha256
    - --rfc2136-tsig-axfr
    - --rfc2136-min-ttl=60s

  # TSIG secret is read from a Secret, never from this file. Create it
  # once, before installing this chart:
  #   kubectl create secret generic rfc2136-tsig -n external-dns \
  #     --from-literal=secret=<the real externaldns-int TSIG value>
  env:
    - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
      valueFrom:
        secretKeyRef:
          name: rfc2136-tsig
          key: secret
